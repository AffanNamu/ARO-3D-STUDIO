name: Worker image

# Builds the RunPod worker (worker/runpod/Dockerfile), proves it on CPU, and publishes it to GitHub Container Registry so a RunPod
# endpoint can run it by digest. Free for a public repository: no GPU is used here. The self-test runs BEFORE the push, so a broken
# image never reaches the registry.

on:
  push:
    branches: [main, claude/zen-johnson-je3dzk]
    paths:
      - worker/runpod/**
      - aro_worker/**
      - aro_studio/**
      - aro_cloud/__init__.py
      - aro_cloud/keys.py
      - aro_cloud/schemas.py
      - requirements.txt
      - scripts/check_engine_imports.py
      - .github/workflows/worker-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build · CPU self-test · push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write  # publish ghcr.io/<owner>/aro-worker; nothing else
    steps:
      - name: Make room (the image is about 20 GB unpacked)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/aro-worker" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build -f worker/runpod/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=ARO 3D Studio RunPod worker (TripoSG image-to-3D)" \
            -t "$IMAGE:$TAG" .
          docker image ls "$IMAGE"
          df -h /

      - name: Self-test on CPU, offline (labelled test-double engine; proves the image, not TripoSG's output)
        run: |
          docker run --rm --network none -v "$PWD/worker/runpod/selftest.py:/selftest.py:ro" "$IMAGE:$TAG" python /selftest.py

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          docker logout ghcr.io
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE:$TAG")
          {
            echo "### Worker image"
            echo
            echo "- tag: \`$IMAGE:$TAG\`"
            echo "- **pin this in RunPod:** \`$ref\`"
            echo "- unpacked size: $((size / 1000000)) MB"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Worker image::$ref"

      - name: Can RunPod pull it without a password?
        run: |
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${TAG}")
          if [ "$code" = "200" ]; then
            echo "- anonymous pull: **yes** (package is public; RunPod needs no registry credential)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- anonymous pull: **no** (HTTP $code). Make the package public (Package settings -> Change visibility) or give RunPod a registry credential." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Worker image is private::Anonymous pull returned HTTP $code"
          fi
