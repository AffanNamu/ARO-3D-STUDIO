<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ARO 3D Studio</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a45"/><stop offset="1" stop-color="#ff5a0a"/></linearGradient></defs><path d="M3 25 13 5l6 12h-5l-3-6-5 14H3Z" fill="url(#g)"/><path d="M18 25l3-6h4l-3 6h-4Zm6-8 3-6 2 4-2 2h-3Z" fill="#e8edf3" opacity=".9"/></svg>
        <div>ARO 3D STUDIO<small>ARO MOTORS · ASSET FACTORY</small></div>
      </div>
      <div id="ctx" class="pill" hidden></div>
      <div class="top-spacer"></div>
      <div id="engine-pill" class="pill" title="Image-to-3D engine status"><span class="dot"></span><span>engine…</span></div>
      <div id="queue-pill" class="pill"><span class="dot"></span><span>idle</span></div>
    </header>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="jobtray" class="jobtray" aria-live="polite"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
